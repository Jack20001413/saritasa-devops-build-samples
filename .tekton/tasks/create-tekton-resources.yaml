apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: create-tekton-resources
  namespace: tekton-pipelines
spec:
  workspaces:
    - name: source
  
  steps:
    - name: create-resources
      image: alpine/k8s:1.33.13
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/bash
        set -eu

        TEKTON_RESOURCES_DIR=(.tekton/pipelines .tekton/tasks)

        for dir in "${TEKTON_RESOURCES_DIR[@]}"; do
            resource=$(basename "$dir")
            resource_count=$(kubectl get "$resource" -A --no-headers 2>/dev/null | wc -l)
            
            if [ "$resource_count" -lt 2 ]; then
                echo "Kind \'"$resource"\' already exists in the cluster. Skipping creation."
                continue
            fi

            echo ""
            echo "Creating resources in $dir..."
            find "$dir" -type f | while read -r file; do
                kubectl apply -f $file
            done
        done
