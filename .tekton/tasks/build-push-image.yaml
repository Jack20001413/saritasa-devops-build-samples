apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: build-push-image
  namespace: saritasa-devops-build-samples-pipelines
spec:
  description: A task to build source code using Buildpacks pack CLI and push image using Docker CLI

  params:
    - name: image-url
      description: URL of the image to be built and pushed
    - name: image-tag
      description: Tag of the image to be built by Paketo
    - name: component-dir
      description: Path of the component directory with changes

  workspaces:
    - name: source
    - name: docker-config

  results:
    - name: image-full-url
      description: Full URL of the built image
    - name: push-result
      description: Whether image is pushed successfully or failed

  # This volume is for Pod in Minikube can interact with local Docker registry
  volumes:
    - name: docker-socket
      hostPath:
        path: /var/run/docker.sock
        type: Socket

  steps:
    - name: build-image
      image: buildpacksio/pack:base
      workingDir: $(workspaces.source.path)/$(params.component-dir)
      env:
        - name: DOCKER_HOST
          value: unix:///var/run/docker.sock
      volumeMounts:
        - name: docker-socket
          mountPath: /var/run/docker.sock
      script: |
        #!/bin/bash
        set -eu

        echo "----Ready to build image at $(pwd)----"

        pack build $(params.image-url):$(params.image-tag) --tag $(params.image-url):latest --path "$(pwd)" --builder paketobuildpacks/builder-jammy-full --verbose
        
        echo -n "$(params.image-url):$(params.image-tag)" > $(results.image-full-url.path)

    - name: push-image
      image: docker:latest
      env:
        - name: DOCKER_HOST
          value: unix:///var/run/docker.sock
      volumeMounts:
        - name: docker-socket
          mountPath: /var/run/docker.sock
      script: |
        #!/bin/sh
        set -eu

        ls -la "$(workspaces.docker-config.path)"

        IMAGE_URL="$(params.image-url):$(params.image-tag)"
        DOCKER_CONFIG_PATH="$(workspaces.docker-config.path)"

        echo "--- Pushing $IMAGE_URL ---"

        # Check if Docker config is provided
        if [ -d "$DOCKER_CONFIG_PATH" ] && [ -f "$DOCKER_CONFIG_PATH/config.json" ]; then
          echo "Using Docker config from workspace"
          export DOCKER_CONFIG="$DOCKER_CONFIG_PATH"
        fi

        echo ""
        echo "Verifying DOCKER_CONFIG"
        echo $DOCKER_CONFIG

        # Push image
        echo "Pushing image $IMAGE_URL"
        if docker push $IMAGE_URL; then
          echo ""
          echo "Image pushed successfully"
          echo "Image URL: $IMAGE_URL"

          # Write result
          echo -n "successful" > $(results.push-result.path)
        else
          echo ""
          echo "Failed to push image $IMAGE_URL"

          echo -n "failed" > $(results.push-result.path)
          exit 1
        fi