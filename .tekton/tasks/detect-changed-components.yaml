apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: detect-changed-components
  namespace: tekton-pipelines
spec:
  workspaces:
    - name: source
  
  results:
    - name: changed-dirs
      description: All directories with file changes

  steps:
    - name: detect-change
      image: alpine/git:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu

        git config --global --add safe.directory /workspace/source

        changed_dirs="$(git diff HEAD~1 HEAD --name-only | xargs -I {} dirname "{}" | sort -u | awk 'BEGIN{printf "["} {if (NR>1) printf ","; printf "\"%s\"", $0} END{printf "]"}')"

        printf '%s' "$changed_dirs" | tee $(results.changed-dirs.path)
