
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: push-image
  namespace: tekton-pipelines
  annotations:
    description: A task to push a OCI image to a registry
spec:
  params:
    - name: image-url
      description: URL of the OCI image

  workspaces:
    - name: docker-credentials

  results:
    - name: image-full-url
      description: Full URL of the built image
    - name: push-result
      description: Whether image is pushed successfully or failed

  steps:
    - name: push-image
      image: docker:latest
      env:
        - name: DOCKER_HOST
          value: unix:///var/run/docker.sock
      script: |
        #!/bin/bash
        set -e

        IMAGE_URL="$(params.image-url)"
        DOCKER_CONFIG_PATH="$(workspaces.docker-credentials.path)"

        echo "--- Pushing $IMAGE_URL ---"

        # Check if Docker config is provided
        if [ -d "$DOCKER_CONFIG_PATH" ] && [ -f "$DOCKER_CONFIG_PATH/config.json" ]; then
          echo "Using Docker config from workspace"
          export DOCKER_CONFIG="$DOCKER_CONFIG_PATH"
        fi

        # Push image
        echo "Pushing image $IMAGE_URL"
        if docker push $IMAGE_URL; then
          echo ""
          echo "Image pushed successfully"
          echo "Image URL: $IMAGE_URL"

          # Write result
          echo -n "successful" > $(results.push-result.path)
          echo -n "$IMAGE_URL" > $(results.image-full-url.path)
        else
          echo ""
          echo "Failed to push image $IMAGE_URL"

          echo -n "failed" > $(results.push-result.path)
          exit 1
        fi