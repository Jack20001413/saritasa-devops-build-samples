apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: build-deploy-single-component
  namespace: tekton-pipelines
spec:
  params:
    - name: repo_url
      type: string
      description: The URL of the Git repository to fetch
    - name: revision
      type: string
      description: The Git revision (branch, tag, commit SHA) to fetch
    - name: image-url
      type: string
      description: URL of the image to be built and pushed
    - name: image-tag
      type: string
      description: Tag of the image built from paketo
    - name: project-dir
      type: string
      description: Full path of the project's directory to be built

  workspaces:
    - name: source
      description: Workspace for the repository
    - name: basic-auth
      description: Git credentials
      optional: true
    # - name: docker-config
    #   description: Docker's config.json for pushing image
    #   optional: true

  results:
    - name: image-url
      description: URL of the image built
      value: $(tasks.pack-build-component.results.image-full-url)

  tasks:
    - name: clone-repository
      taskRef:
        name: git-clone
      params:
        - name: url
          value: $(params.repo_url)
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: output
          workspace: source
        - name: basic-auth
          workspace: basic-auth
    
    
