apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: main-pipeline
  namespace: tekton-pipelines
spec:
  params:
    - name: repo_url
      description: The repo URL where Git will clone
    - name: revision
      description: Repo's commit SHA
    - name: git-auth-secret-name
      description: Name of Kubernetes secret holding Git credentials

  workspaces:
    - name: source
    - name: basic-auth
    
  tasks:
    - name: fetch-repository
      taskRef:
        name: git-clone
      params:
        - name: url
          value: $(params.repo_url)
        - name: revision
          value: $(params.revision)
        - name: depth
          value: "0"
        - name: deleteExisting
          value: "true"
      workspaces:
        - name: output
          workspace: source
        - name: basic-auth
          workspace: basic-auth

    - name: detect-changed-components
      taskRef:
        name: detect-changed-components
      runAfter:
        - fetch-repository
      workspaces:
        - name: source
          workspace: source

      - name: build-push-deploy-changed-components
        taskRef:
          name: trigger-components-build
        runAfter:
          - detect-changed-components
        params:
          - name: repo-url
            value: $(params.repo_url)
          - name: revision
            value: $(params.revision)
          - name: git-auth-secret-name
            value: $(params.git-auth-secret-name)
          - name: changed-components
            value: $(results.detect-changed-components.changed-dirs)
          - name: max-concurrent-builds
            value: "5"
        workspaces:
          - name: source
            workspace: source
      