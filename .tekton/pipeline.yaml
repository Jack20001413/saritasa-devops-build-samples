apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: saritasa-test-app-pipeline
spec:
  params:
    - name: repo_url
    - name: revision
  workspaces:
    - name: source
    - name: basic-auth
  tasks:
    - name: fetch-repository
      taskRef:
        name: git-clone
      params:
        - name: url
          value: $(params.repo_url)
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: output
          workspace: source
        - name: basic-auth
          workspace: basic-auth

    - name: build-and-push
      taskRef:
        name: build-push-image
      runAfter:
        - fetch-repository
      workspaces:
        - name: source
          workspace: source
      